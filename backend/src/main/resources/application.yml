server:
  port: 8080

spring:
  application:
    name: karavany
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/karavany}
    username: ${SPRING_DATASOURCE_USERNAME:karavany}
    password: ${SPRING_DATASOURCE_PASSWORD:karavany}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/karavany}

intel:
  base-url: ${INTEL_BASE_URL:http://localhost:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info
